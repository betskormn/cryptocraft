<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · CryptoCraft</title>
    <style>
        :root {
            --bg: #1B1F24;
            --paper: #222831;
            --text: #E7ECF2;
            --muted: #AAB4C2;
            --accent: #F2A23A;
            --accent-text: #14181D;
            --line: rgba(255, 255, 255, 0.12);
            --error: #EF4444;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 16px;
            background: var(--bg);
            background-image: radial-gradient(1100px 520px at 20% -10%, rgba(242, 162, 58, 0.16), transparent 55%),
                              radial-gradient(900px 520px at 80% 0%, rgba(110, 231, 183, 0.08), transparent 55%);
            color: var(--text);
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        }

        main {
            width: 100%;
            max-width: 380px;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 28px 24px;
        }

        h1 { margin: 0 0 4px; font-size: 22px; font-weight: 850; }
        .brand { color: var(--accent); }
        p.sub { margin: 0 0 22px; color: var(--muted); }

        label { display: block; margin: 14px 0 6px; font-size: 14px; color: var(--muted); }

        input {
            width: 100%;
            padding: 11px 12px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            font: inherit;
        }

        input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: var(--accent-text);
            font: inherit;
            font-weight: 750;
            cursor: pointer;
        }

        .notice {
            margin-bottom: 8px;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 14px;
        }

        .notice.error { background: rgba(239, 68, 68, 0.12); color: #FCA5A5; }
        .notice.info { background: rgba(96, 165, 250, 0.12); color: #BFDBFE; }
    </style>
</head>
<body>
<main>
    <h1><span class="brand">CryptoCraft</span></h1>
    <p class="sub">Sign in to the admin, kitchen and bar screens</p>

    <div class="notice error" th:if="${param.error}">Wrong email or password</div>
    <div class="notice info" th:if="${param.logout}">You have signed out</div>

    <form method="post" th:action="@{/login}">
        <label for="username">Email</label>
        <input id="username" name="username" type="email" autocomplete="username" required autofocus>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Sign in</button>
    </form>
</main>
</body>
</html>

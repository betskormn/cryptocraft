spring:
  application:
    name: price-streaming-service
  profiles:
    # IDE / bootRun without flags; containers set SPRING_PROFILES_ACTIVE=prod
    default: local
  kafka:
    consumer:
      group-id: price-stream-group
      # screens only need prices from now on; the latest price per item is kept in memory for new screens
      auto-offset-reset: latest
  docker:
    compose:
      # infrastructure is started explicitly (see README)
      enabled: false

eureka:
  client:
    registry-fetch-interval-seconds: 5
  instance:
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    org.apache.kafka: INFO

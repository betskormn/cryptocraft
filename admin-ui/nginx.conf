server {
    listen 80;
    root /usr/share/nginx/html;

    # gateway resolved per request through Docker's DNS, so nginx starts even if the gateway is not up yet
    resolver 127.0.0.11 valid=10s;
    set $gateway http://api-gateway:8765;

    location /api/ {
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # signing in and out: the gateway talks to identity-service and keeps the tokens in its session
    location /oauth2/ {
        proxy_pass $gateway;
        proxy_set_header Host $host;
    }

    location /login/oauth2/ {
        proxy_pass $gateway;
        proxy_set_header Host $host;
    }

    location = /logout {
        proxy_pass $gateway;
        proxy_set_header Host $host;
    }

    location = /tv.html {
        proxy_pass $gateway;
    }

    location /ws/ {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    # client-side routes (/brands, /items, ...) fall back to the SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}

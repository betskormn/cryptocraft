plugins {
    id 'java-platform'
}

group = 'com.cryptocraft'
version = '1.0.0-SNAPSHOT'

javaPlatform {
    allowDependencies()
}

dependencies {
    api platform("org.springframework.boot:spring-boot-dependencies:4.0.2")
    api platform("org.springframework.cloud:spring-cloud-dependencies:2025.1.1")

    api "org.postgresql:postgresql:42.7.2"
    api "org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.1"
    api "org.mapstruct:mapstruct:1.6.3"
    api "org.mapstruct:mapstruct-processor:1.6.3"

    api "org.projectlombok:lombok-mapstruct-binding:0.2.0"
}
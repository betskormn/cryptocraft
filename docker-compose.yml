services:
  eureka-server:
    image: docker.io/library/eureka-server:0.0.1-SNAPSHOT
    build:
      context: ./eureka-server
    ports:
      - "8761:8761"
    container_name: eureka-server
    networks:
      - cryptocraft-network

  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - cryptocraft-network

  inventory-service:
    image: inventory-service:latest
    build:
      context: ./inventory-service
    ports:
      - "8081:8081"
      - "5005:5005"
    container_name: inventory-service
    depends_on:
      - eureka-server
      - postgres
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    command: [ "java", "--add-opens", "java.base/java.lang=ALL-UNNAMED", "-jar", "inventory-service.jar" ]
    networks:
      - cryptocraft-network

  pricing-service:
    image: pricing-service:latest
    build:
      context: ./pricing-service
    ports:
      - "8082:8082"
      - "5006:5006"
    container_name: pricing-service
    depends_on:
      - eureka-server
      - inventory-service
      - kafka
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DOCKER_COMPOSE_ENABLED=false
      - INVENTORY_SERVICE_URL=http://inventory-service:8081
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    command: [ "java", "--add-opens", "java.base/java.lang=ALL-UNNAMED", "-jar", "pricing-service.jar" ]
    networks:
      - cryptocraft-network

  price-streaming-service:
    image: price-streaming-service:latest
    build:
      context: ./price-streaming-service
    ports:
      - "8083:8083"
      - "5007:5007"
    container_name: price-streaming-service
    depends_on:
      - eureka-server
      - kafka
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5007
    command: [ "java", "--add-opens", "java.base/java.lang=ALL-UNNAMED", "-jar", "price-streaming-service.jar" ]
    networks:
      - cryptocraft-network




  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - cryptocraft-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - cryptocraft-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - cryptocraft-network

  api-gateway:
    image: api-gateway:latest
    build:
      context: ./api-gateway
    ports:
      - "8765:8765"
    container_name: api-gateway
    depends_on:
      - eureka-server
      - inventory-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - INVENTORY_SERVICE_URL=http://inventory-service:8081
    networks:
      - cryptocraft-network

networks:
  cryptocraft-network:

volumes:
  postgres_data:

# Full stack for development: every service in a container with the `prod` Spring profile,
# plus debug ports and Kafka UI. To run services from the IDE (`local` profile) start only the
# infrastructure: docker compose up -d postgres zookeeper kafka kafka-ui eureka-server
services:
  eureka-server:
    image: eureka-server:latest
    build:
      context: ./eureka-server
    ports:
      - "8761:8761"
    container_name: eureka-server
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:8761/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - cryptocraft-network

  postgres:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      - cryptocraft-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - cryptocraft-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # INTERNAL for containers (kafka:29092), EXTERNAL for services run on the host (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092" ]
      interval: 10s
      timeout: 10s
      retries: 30
    networks:
      - cryptocraft-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - cryptocraft-network

  inventory-service:
    image: inventory-service:latest
    build:
      context: ./inventory-service
    ports:
      - "8081:8081"
      - "5005:5005"
    container_name: inventory-service
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    command: [ "java", "--add-opens", "java.base/java.lang=ALL-UNNAMED", "-jar", "inventory-service.jar" ]
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:8081/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 40
    networks:
      - cryptocraft-network

  pricing-service:
    image: pricing-service:latest
    build:
      context: ./pricing-service
    ports:
      - "8082:8082"
      - "5006:5006"
    container_name: pricing-service
    depends_on:
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006
    command: [ "java", "--add-opens", "java.base/java.lang=ALL-UNNAMED", "-jar", "pricing-service.jar" ]
    networks:
      - cryptocraft-network

  price-streaming-service:
    image: price-streaming-service:latest
    build:
      context: ./price-streaming-service
    ports:
      - "8083:8083"
      - "5007:5007"
    container_name: price-streaming-service
    depends_on:
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5007
    command: [ "java", "--add-opens", "java.base/java.lang=ALL-UNNAMED", "-jar", "price-streaming-service.jar" ]
    networks:
      - cryptocraft-network

  api-gateway:
    image: api-gateway:latest
    build:
      context: ./api-gateway
    ports:
      - "8765:8765"
    container_name: api-gateway
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - cryptocraft-network

networks:
  cryptocraft-network:

volumes:
  postgres_data:

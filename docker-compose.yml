version: '3.8'

services:
  eureka-server:
    image: docker.io/library/eureka-server:0.0.1-SNAPSHOT
    build:
      context: ./eureka-server
    ports:
      - "8761:8761"
    networks:
      - cryptocraft-network

  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cryptocraft-network

  inventory-service:
    image: inventory-service:latest
    build:
      context: ./inventory-service
    ports:
      - "8081:8081"
    depends_on:
      - eureka-server
      - postgres
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
    command: ["java", "--add-opens", "java.base/java.lang=ALL-UNNAMED", "-jar", "inventory-service.jar"]
    networks:
      - cryptocraft-network

  api-gateway:
    image: api-gateway:latest
    #    image: docker.io/library/api-gateway:0.0.1-SNAPSHOT
    build:
      context: ./api-gateway
    ports:
      - "8765:8765"
    depends_on:
      - eureka-server
      - inventory-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - INVENTORY_SERVICE_URL=http://inventory-service:8081
    networks:
      - cryptocraft-network

networks:
  cryptocraft-network:

volumes:
  postgres-data:

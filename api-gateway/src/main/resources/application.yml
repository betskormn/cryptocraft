spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: inventory-service
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/api/**

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8080/eureka


